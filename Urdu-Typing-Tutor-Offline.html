</style></head><body><div class="mt-h" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h1>Urdu Typing Tutor (Offline)</h1><p>Works without internet. Use your phone Urdu keyboard or the on-screen Urdu keyboard.</p></div><button id="theme" class="btn" aria-label="Switch light or dark theme" style="min-width:46px">&#9680;</button></div>

<script>window.URDU=1;
const LESSONS = {"── STAGE 1: URDU LETTERS ──": "", "1. Urdu Letters: ا ب پ ت ٹ ث": "ا ب پ ت ٹ ث ا ب پ ت ٹ ث ب ا ت پ ث ٹ اب پت ٹث", "2. Urdu Letters: ج چ ح خ د ڈ ذ": "ج چ ح خ د ڈ ذ ج چ ح خ د ڈ ذ جد چح خذ ڈج", "3. Urdu Letters: ر ڑ ز ژ س ش ص ض": "ر ڑ ز ژ س ش ص ض ر ڑ ز ژ س ش ص ض رس زش صض", "4. Urdu Letters: ط ظ ع غ ف ق ک گ": "ط ظ ع غ ف ق ک گ ط ظ ع غ ف ق ک گ عغ فق کگ", "5. Urdu Letters: ل م ن و ہ ھ ء ی ے": "ل م ن و ہ ھ ء ی ے ل م ن و ہ ھ ء ی ے", "── STAGE 2: WORDS AND SENTENCES ──": "", "6. Common Urdu Words": "اور کی کا کے میں سے پر کو ہے ہیں تھا تھی نہیں یہ وہ ہم آپ میرا تمہارا اچھا بہت کام وقت دن رات", "7. Short Sentences": "میرا نام علی ہے۔ آج موسم بہت اچھا ہے۔ ہم کل بازار جائیں گے۔ وقت بہت قیمتی ہوتا ہے۔ محنت میں عظمت ہے۔", "8. Punctuation: ، ۔ ؟ !": "آپ کیسے ہیں؟ میں ٹھیک ہوں، شکریہ۔ واہ! کیا بات ہے۔ کہاں جا رہے ہو؟", "9. Urdu Digits": "۱ ۲ ۳ ۴ ۵ ۶ ۷ ۸ ۹ ۰ ۱۲ ۳۴ ۵۶ ۷۸ ۹۰ ۱۲۳ ۴۵۶ ۷۸۹", "10. Paragraph with Enter": "ہم روز صبح جلدی اٹھتے ہیں۔\nپھر ناشتہ کر کے کام پر جاتے ہیں۔\nمحنت اور صبر سے ہر مشکل آسان ہو جاتی ہے۔"};

{id:"custom",name:"Custom text (paste your own)",desc:"Practice with any text you paste",texts:[""]},

/* ---------- text building ---------- */
function buildText(){
  const need=state.mins*60*8;
  let out="";
  if(state.mode==="lesson"){
    const base=LESSONS[state.lesson]; out=base;
    while(out.length<need) out+=" "+base;
  } else {
    if(state.topic==="custom"){var ct=(($("ctext")||{}).value||"").replace(/[^\S\n]+/g," ").replace(/\s*\n\s*/g,"\n").trim().slice(0,12000);if(ct.length<20){toast("Please paste at least a few words of text first.");return "";}return ct;}
    const T=topicObj(), arr=T.texts; let i=Math.floor(Math.random()*arr.length), used=1;
    out=arr[i];
    while(out.length<need){ if(used<arr.length){ i=(i+1)%arr.length; out+="\n"+arr[i]; used++; } else if(T.loop){ out+="\n"+arr[0]; } else { out+="\n"+POOL[Math.floor(Math.random()*POOL.length)]; } }
  }
  return out.replace(/[ \t]*\n[ \t\n]*/g,"\n").trim();
}

}

function uoskSet(on){UOSK=on;$("uosk").classList.toggle("hide",!on);$("uoskT").textContent="Urdu keyboard: "+(on?"on":"off");if(on)uoskBuild();inp.setAttribute("inputmode",on?"none":"text")}
function phSet(on){PH.on=on;$("phT").textContent="Phonetic keys: "+(on?"on":"off")}
function initExtras(){
  try{var c=localStorage.getItem("mt_custom");if(c)$("ctext").value=c}catch(e){}
  $("cuse").onclick=function(){try{localStorage.setItem("mt_custom",$("ctext").value)}catch(e){}start()};
  if(window.URDU){$("oskT").classList.add("hide");$("uoskT").classList.remove("hide");$("phT").classList.remove("hide");$("uoskT").onclick=function(){uoskSet(!UOSK)};$("phT").onclick=function(){phSet(!PH.on)}}
  else{if(IS_PHONE){$("oskT").classList.add("hide");oskSet(false)}else{var on=innerWidth>=700;try{var s=localStorage.getItem("mt_osk2");if(s!==null)on=s==="1"}catch(e){}oskSet(on);$("oskT").onclick=function(){oskSet(!oskOn,true)}}}
}
function feed(v){
  if(left<=0||pos>=target.length||!v)return;
  if(!running)begin();
  for(let i=0;i<v.length;i++){
    if(pos>=target.length)break;
    if(v[i]===" "&&!/\s/.test(target[pos])){
      var w0=wIdx[pos];
      if(pos===0||/\s/.test(target[pos-1]))continue;
      typed++;errors++;var k0=target[pos].toLowerCase();KT[k0]=(KT[k0]||0)+1;KE[k0]=(KE[k0]||0)+1;wBad[w0]=true;
      for(var q=pos;q<=wEnd[w0];q++)spans[q].className="sk";
      pos=wEnd[w0]+1;if(pos<target.length&&target[pos]===" "){spans[pos].className="ok";pos++}
      oskFlash(" ",false);if(navigator.vibrate)navigator.vibrate(12);continue;
    }
    typed++;var kc=target[pos].toLowerCase();KT[kc]=(KT[kc]||0)+1;
    if(v[i]===target[pos]){spans[pos].className="ok";oskFlash(kc,true);}
    else{spans[pos].className="bad";errors++;KE[kc]=(KE[kc]||0)+1;wBad[wIdx[pos]]=true;oskFlash(kc,false);if(navigator.vibrate)navigator.vibrate(12);}
    pos++;
  }
  const c=spans[pos];
  if(c){c.classList.add("cur");if(c.offsetTop-textEl.scrollTop>textEl.clientHeight*0.6) textEl.scrollTop=c.offsetTop-textEl.clientHeight*0.25;}
  oskNext(); stats();
  if(pos>=target.length)finish();
}
inp.addEventListener("input",()=>{var v=inp.value;inp.value="";feed(window.URDU&&PH.on?phon(v):v)});

$("start").onclick=start;
$("reset").onclick=()=>{
  clearInterval(timer); running=false; inp.disabled=true; inp.value="";
  textEl.className="text idle"; textEl.textContent="Mode, topic ya lesson aur time chuno, phir Start dabao."; $("enterHint").classList.add("hide");
  $("result").classList.add("hide");
  $("t").textContent="0:00"; $("w").textContent="0"; $("a").textContent="100%"; $("barfill").style.width="100%";
};

load(); if(window.PRESET)Object.assign(state,window.PRESET); refreshUI(); initExtras();
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeSheet();$("reset").click()}});
</script></body></html>
